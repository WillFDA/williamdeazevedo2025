name: Trigger Cloudflare build

# Triggers a Cloudflare build via a Deploy Hook in two situations:
#
#  1. A new/updated article is pushed  -> rebuild so it goes live immediately.
#  2. Every day on a schedule          -> picks up articles whose `pubDate`
#     (scheduled release date) has been reached. Since the site is built
#     statically, a future-dated article only appears after a rebuild.
#
# Setup (one-time):
#  - Cloudflare dashboard > Workers & Pages > your project > Settings >
#    Build > Deploy hooks -> create a hook, copy its URL.
#  - GitHub repo > Settings > Secrets and variables > Actions ->
#    add a secret named CLOUDFLARE_DEPLOY_HOOK with that URL.

on:
  push:
    branches:
      - 2026
      - main
    paths:
      - "src/content/articles/**"
  schedule:
    # 05:10 UTC every day. Increase the frequency if you need finer-grained
    # scheduling (e.g. "0 * * * *" for hourly).
    - cron: "10 5 * * *"
  workflow_dispatch:

# Avoid stacking redundant deploys if several pushes land close together.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Cloudflare Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Missing CLOUDFLARE_DEPLOY_HOOK secret. See workflow header for setup."
            exit 1
          fi
          echo "Triggering Cloudflare build (event: ${{ github.event_name }})..."
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK")
          echo "Deploy hook responded with HTTP $status"
          case "$status" in
            2*) echo "Build triggered successfully." ;;
            *) echo "::error::Deploy hook failed (HTTP $status)"; exit 1 ;;
          esac
